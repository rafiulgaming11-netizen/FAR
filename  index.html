
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b17">
<title>Football Expert BD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b17;color:#f4fff8;
font-family:Arial,sans-serif;padding:16px}
header{padding:20px 0}
h1{color:#63f5a4;font-size:27px;margin:0 0 8px}
p{line-height:1.6;color:#c6d8cf}
.card{background:#102a23;border:1px solid #29483b;
border-radius:16px;padding:16px;margin:14px 0}
h2{font-size:19px;margin-top:0}
label{display:block;margin:12px 0 6px;color:#d9eee2}
input,select,button{font:inherit;border-radius:10px;
padding:12px;width:100%}
input,select{background:#071b17;color:white;
border:1px solid #426456}
button{background:#63f5a4;color:#071b17;
font-weight:bold;border:0;margin-top:12px}
.stat{display:flex;justify-content:space-between;
gap:12px;padding:10px 0;border-bottom:1px solid #29483b}
.small{font-size:13px;color:#b6cec0}
.answer{white-space:pre-wrap;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>⚽ Football Expert BD</h1>
<p>ফুটবল বুঝো, স্ট্যাটস বিশ্লেষণ করো, বাংলায় উত্তর জানো।</p>
</header>

<section class="card">
<h2>📊 ম্যাচ বিশ্লেষক</h2>
<label>হোম দলের নাম</label>
<input id="home" value="Team A">
<label>অ্যাওয়ে দলের নাম</label>
<input id="away" value="Team B">

<label>হোম দলের Shots on Target</label>
<input id="hs" type="number" min="0" value="5">
<label>অ্যাওয়ে দলের Shots on Target</label>
<input id="as" type="number" min="0" value="3">

<label>হোম দলের পজেশন (%)</label>
<input id="hp" type="number" min="0" max="100" value="55">
<label>হোম দলের গোল</label>
<input id="hg" type="number" min="0" value="2">
<label>অ্যাওয়ে দলের গোল</label>
<input id="ag" type="number" min="0" value="1">

<button onclick="analyze()">ম্যাচ বিশ্লেষণ করো</button>
<div id="result" class="answer"></div>
</section>

<section class="card">
<h2>📚 ফুটবল জ্ঞান</h2>
<label>বিষয় নির্বাচন করো</label>
<select id="topic">
<option value="sot">Shots on Target</option>
<option value="shots">Shots Towards Goal</option>
<option value="possession">Ball Possession</option>
<option value="xg">Expected Goals (xG)</option>
<option value="corner">Corner Kick</option>
<option value="offside">Offside</option>
<option value="cards">Yellow ও Red Card</option>
<option value="draw">Draw ও Extra Time</option>
</select>
<button onclick="learn()">সহজ বাংলায় বুঝিয়ে দাও</button>
<div id="lesson" class="answer"></div>
</section>

<section class="card">
<h2>🤖 ফুটবল প্রশ্নোত্তর</h2>
<label>তোমার প্রশ্ন লেখো</label>
<input id="question" placeholder="যেমন: xG মানে কী?">
<button onclick="ask()">উত্তর দেখাও</button>
<div id="chat" class="answer"></div>
<p class="small">এটি অফলাইন নিয়মভিত্তিক ডেমো, পূর্ণ AI নয়।</p>
</section>

<script>
function num(id){
 return Number(document.getElementById(id).value);
}
function analyze(){
 const h=document.getElementById("home").value.trim()||"হোম দল";
 const a=document.getElementById("away").value.trim()||"অ্যাওয়ে দল";
 const hs=num("hs"), as=num("as"), hp=num("hp");
 const hg=num("hg"), ag=num("ag");
 const out=document.getElementById("result");

 if([hs,as,hp,hg,ag].some(v=>!Number.isFinite(v)||v<0) ||
 hp>100){
  out.textContent="সঠিক সংখ্যা দাও। পজেশন ০ থেকে ১০০-এর মধ্যে হতে হবে।";
  return;
 }
 if(!Number.isInteger(hs)||!Number.isInteger(as)||
 !Number.isInteger(hg)||!Number.isInteger(ag)){
  out.textContent="শট ও গোলের সংখ্যা পূর্ণসংখ্যা হতে হবে।";
  return;
 }
 let form="";
 if(hg>ag) form=h+" স্কোরে এগিয়ে আছে।";
 else if(hg<ag) form=a+" স্কোরে এগিয়ে আছে।";
 else form="দুই দল সমান গোলে আছে।";

 let shots="";
 if(hs>as) shots=h+" লক্ষ্যে বেশি শট নিয়েছে।";
 else if(hs<as) shots=a+" লক্ষ্যে বেশি শট নিয়েছে।";
 else shots="দুই দলের লক্ষ্যে শট সমান।";

 let possession="";
 if(hp>50) possession=h+"-এর পজেশন বেশি।";
 else if(hp<50) possession=a+"-এর পজেশন বেশি।";
 else possession="পজেশন সমান।";

 out.textContent="ম্যাচের সারাংশ\n"+form+"\n"+shots+
 "\n"+possession+
 "\n\nমনে রেখো: বেশি শট বা পজেশন মানেই জয় নিশ্চিত নয়।"+
 "\nএটি দেওয়া তথ্যের ভিত্তিতে সাধারণ বিশ্লেষণ; ভবিষ্যদ্বাণী নয়।";
}
const lessons={
 sot:"Shots on Target হলো এমন শট যা গোল হতো, যদি গোলকিপার বা গোললাইন রক্ষাকারী ডিফেন্ডার বাধা না দিত।",
 shots:"Shots Towards Goal কথাটি সাধারণ বর্ণনা হতে পারে। সঠিক পরিসংখ্যানের সংজ্ঞা ডেটা প্রদানকারীর ওপর নির্ভর করে।",
 possession:"Ball Possession হলো দলের বল নিয়ন্ত্রণের শতকরা হার। বেশি পজেশন থাকলেই জয় নিশ্চিত নয়।",
 xg:"xG বা Expected Goals হলো একটি শট থেকে গোল হওয়ার সম্ভাবনার পরিমাপ। ০.৪ xG মানে ওই ধরনের শটের আনুমানিক গোল সম্ভাবনা ৪০ শতাংশ।",
 corner:"Corner Kick দেওয়া হয় নির্দিষ্ট পরিস্থিতিতে বল ডিফেন্ডারের শেষ স্পর্শে গোললাইন পার হলে, গোল না হলে।",
 offside:"Offside অবস্থানে থাকাই অপরাধ নয়। সতীর্থ বল খেলার সময় খেলোয়াড়ের অবস্থান ও পরবর্তী সক্রিয় খেলায় অংশ নেওয়ার বিষয় বিবেচিত হয়।",
 cards:"Yellow Card হলো সতর্কতা; Red Card হলে খেলোয়াড়কে মাঠ ছাড়তে হয়।",
 draw:"নিয়ম অনুযায়ী ড্র হতে পারে। নকআউট ম্যাচে প্রতিযোগিতার নিয়ম অনুসারে অতিরিক্ত সময় বা পেনাল্টি হতে পারে।"
};
function learn(){
 document.getElementById("lesson").textContent=
 lessons[document.getElementById("topic").value];
}
function ask(){
 const q=document.getElementById("question").value.toLowerCase().trim();
 const out=document.getElementById("chat");
 if(!q){out.textContent="প্রথমে একটি প্রশ্ন লেখো।";return;}
 if(q.includes("xg")||q.includes("expected goals")) out.textContent=lessons.xg;
 else if(q.includes("shots on target")) out.textContent=lessons.sot;
 else if(q.includes("shots towards goal")) out.textContent=lessons.shots;
 else if(q.includes("possession")||q.includes("পজেশন")) out.textContent=lessons.possession;
 else if(q.includes("offside")||q.includes("অফসাইড")) out.textContent=lessons.offside;
 else if(q.includes("corner")||q.includes("কর্নার")) out.textContent=lessons.corner;
 else if(q.includes("card")||q.includes("কার্ড")) out.textContent=lessons.cards;
 else if(q.includes("draw")||q.includes("ড্র")) out.textContent=lessons.draw;
 else out.textContent="এই ডেমোতে উত্তরটি নেই। আরও প্রশ্নের উত্তর পেতে পরে AI সংযোগ করতে হবে।";
}
</script>
</body>
</html>
